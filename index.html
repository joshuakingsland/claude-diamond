<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- GitHub Pages is serving this repository from its root, so the site root
     would otherwise land on Jekyll's render of the README while the model card
     sits at /docs/. This redirects to it.

     Changing the Pages source to `main` /docs makes this file redundant rather
     than wrong: it would simply stop being served. Deleting it then is tidying,
     not a fix.

     A meta refresh is the only redirect available on plain GitHub Pages —
     there is no server-side rewrite without a Jekyll plugin. The canonical
     link tells crawlers where the real page is, and the visible link means the
     page still works if a reader has JavaScript and meta refresh disabled. -->
<meta http-equiv="refresh" content="0; url=./docs/">
<link rel="canonical" href="https://joshuakingsland.github.io/claude-diamond/docs/">
<title>Diamond Ledger | Model Card Read</title>
<style>
  body{background:#0b0e14;color:#e8eaf0;font-family:system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  a{color:#e8b54d}
</style>
</head>
<body>
<p>Redirecting to the <a href="./docs/">model card</a>.</p>
</body>
</html>
