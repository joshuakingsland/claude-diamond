name: backfill per-game full-game MLB odds
on:
  workflow_dispatch:
    inputs:
      start: {description: 'First date (YYYY-MM-DD)', required: true, default: '2020-07-23'}
      end: {description: 'Last date (YYYY-MM-DD)', required: true, default: '2024-09-29'}
      max_events: {description: 'Hard event cap (~30 credits each)', required: true, default: '100'}
      events_per_checkpoint: {description: 'Commit after this many paid events', required: true, default: '100'}
      lead_minutes: {description: 'Minutes before each game start', required: true, default: '20'}
      snapshot_role: {description: 'early or close', required: true, default: 'close'}
      dry_run: {description: 'Estimate only; no API calls', type: boolean, default: true}
permissions: {contents: write}
concurrency: {group: full-game-event-backfill, cancel-in-progress: false}
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Capture and checkpoint
        env: {ODDS_API_KEY: '${{ secrets.ODDS_API_KEY }}'}
        run: |
          if [ '${{ inputs.dry_run }}' = true ]; then
            python full_game_event_odds.py --start '${{ inputs.start }}' --end '${{ inputs.end }}' --max-events '${{ inputs.max_events }}' --lead-minutes '${{ inputs.lead_minutes }}' --snapshot-role '${{ inputs.snapshot_role }}' --dry-run
            exit 0
          fi
          left='${{ inputs.max_events }}'; n=1
          while [ "$left" -gt 0 ]; do
            chunk='${{ inputs.events_per_checkpoint }}'; [ "$chunk" -gt "$left" ] && chunk="$left"
            python full_game_event_odds.py --start '${{ inputs.start }}' --end '${{ inputs.end }}' --max-events "$chunk" --lead-minutes '${{ inputs.lead_minutes }}' --snapshot-role '${{ inputs.snapshot_role }}'
            git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add data/full_game_event_audit.csv data/full_game_event_quotes
            git diff --cached --quiet || (git commit -m "data: full-game event checkpoint $n" && git push)
            left=$((left-chunk)); n=$((n+1))
          done
