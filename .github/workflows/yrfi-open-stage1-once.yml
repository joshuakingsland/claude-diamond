name: launch YRFI opening research stage 1 once

# One-shot transport for the authorized 2023-2024 opening-ladder study. The
# file is deleted after GitHub accepts the run, so later data commits cannot
# retrigger paid collection.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yrfi-open-stage1-once.yml"

permissions:
  contents: write

concurrency:
  group: first-inning-study
  cancel-in-progress: false

jobs:
  opening-ladder-stage-1:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Collect the frozen 2023-2024 opening ladder
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          total="11240"
          checkpoint="100"
          leads="1440,720,360,180,60"
          seasons="2023,2024"

          remaining="$total"
          batch=1
          while [ "$remaining" -gt 0 ]; do
            this_batch="$checkpoint"
            if [ "$this_batch" -gt "$remaining" ]; then
              this_batch="$remaining"
            fi
            python first_inning_open_odds.py \
              --max-calls "$this_batch" --lead-minutes "$leads" \
              --seasons "$seasons"
            python first_inning_open_evaluation.py --draws 500
            bash commit_data.sh \
              "data: first-inning opening ladder checkpoint ${batch}" \
              data/first_inning_open_audit.csv \
              data/first_inning_open_quotes.csv \
              data/research/yrfi_open_rows.csv \
              first_inning_open_evaluation.json
            remaining=$((remaining - this_batch))
            batch=$((batch + 1))
          done

      - name: Preserve any paid rows after an unexpected failure
        if: ${{ always() }}
        run: |
          python first_inning_open_evaluation.py --draws 500 || true
          bash commit_data.sh \
            "data: preserve first-inning opening ladder checkpoint" \
            data/first_inning_open_audit.csv \
            data/first_inning_open_quotes.csv \
            data/research/yrfi_open_rows.csv \
            first_inning_open_evaluation.json
