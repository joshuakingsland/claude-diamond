name: odds burst

# High-frequency capture across the window before first pitch, to measure how
# long a price survives rather than only where it was.
#
# Why one long job instead of a tighter cron. GitHub's scheduler has a
# five-minute floor, fires late under load, and silently drops runs when the
# fleet is busy — two captures were lost that way before `merge_data.py`
# existed. A single job that sleeps between polls gets true ninety-second
# resolution, one predictable credit bill, and no dependence on the scheduler
# beyond starting it once.
#
# Cost. Each poll bills `regions x markets` credits exactly as the hourly
# capture does — six today — so 5.5 hours at ninety seconds is about 1,320
# credits per burst. `odds_burst.py` prints the estimate before spending and
# refuses a burst above `--max-credits`, so a mistyped interval cannot drain
# the quota.
#
# Every poll is also screened for line-shopping alerts in flight. That is the
# only cadence that catches them: three quarters of qualifying prices are gone
# by the next poll, and the hourly path sees a few percent of what passes
# through.
#
# The rows land in the same monthly quote shards as `odds.py`, with the same
# schema and the same de-vig. Nothing downstream needs to know a burst
# happened: a burst is simply many captures close together, and `devig.py`
# already groups by capture.

on:
  schedule:
    # Two bursts, back to back, covering 14:00-01:00 UTC.
    #
    # The original single 21:50 burst was aimed at "the evening slate", which
    # turned out to be the wrong target. Counting how many games sit inside
    # their own 20-240 minute lock window at each minute of the day, the demand
    # curve is bimodal — a matinee block peaking around 16:00 UTC and the main
    # block peaking 20:00-23:00 — and three hours from 21:50 covered only
    # **28% of lock-window game-minutes**, with a third of games getting no
    # burst coverage at all. Since three quarters of shop opportunities die
    # within one 90-second poll, an uncovered window is not a delayed
    # detection, it is a missed one.
    #
    # 14:00 and 19:30 for 5.5 hours each covers **96%**. The pair was chosen by
    # searching the demand curve rather than by reasoning about when games
    # "usually" start.
    #
    # Cost is not the constraint here. Each burst is about 1,320 credits, so
    # the pair runs ~2,640 a day and ~554,000 across a season, against a
    # balance near four million. The binding limit is GitHub's six-hour job
    # ceiling, which is why the window is 5.5 hours and not longer.
    - cron: "0 14 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep polling"
        required: false
        default: "330"
      every:
        description: "Seconds between polls (floor 45)"
        required: false
        default: "90"
      max_credits:
        description: "Refuse to start a burst costing more than this"
        required: false
        default: "1500"

permissions:
  contents: write

# No concurrency group, for the same reason `odds.yml` has none: GitHub holds
# only one pending run per group, so a third arrival cancels the second and a
# lost snapshot is only re-buyable at five times the price. Overlap is allowed
# and `commit_data.sh` merges.

jobs:
  burst:
    runs-on: ubuntu-latest
    # Generous enough for the longest burst the inputs allow, plus checkout,
    # install and commit. A job that outlives its burst is only wasting a few
    # minutes; one that is cut short loses the tail of the window, which is
    # exactly the part nearest the close and the most valuable.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Skip out of season
        id: season
        run: |
          MONTH=$(date -u +%m)
          if [ "$MONTH" -ge 03 ] && [ "$MONTH" -le 10 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Out of season; nothing to capture."
          fi

      - uses: actions/setup-python@v5
        if: steps.season.outputs.active == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.season.outputs.active == 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Burst capture
        if: steps.season.outputs.active == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Optional. Without them the burst still screens and still logs
          # every detection; it just does not mail.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        # The credit floor is deliberately higher than the hourly capture's.
        # A burst spends in one job what the hourly path spends in a week, so
        # it should stand down earlier and leave the routine capture running.
        run: |
          python odds_burst.py --require-key \
            --minutes "${{ inputs.minutes || '330' }}" \
            --every "${{ inputs.every || '90' }}" \
            --max-credits "${{ inputs.max_credits || '1500' }}" \
            --min-credits 2000 \
            --alert --send

      - name: Commit the burst
        # always(), for the reason the hourly capture uses it: the quotes are
        # already on disk and already paid for by the time anything downstream
        # can fail. A success-gated commit would throw away a window that
        # cannot be re-bought at the live price.
        if: ${{ always() && steps.season.outputs.active == 'true' }}
        run: |
          bash commit_data.sh "data: odds burst $(date -u +%Y-%m-%dT%H:%MZ)" \
            data
