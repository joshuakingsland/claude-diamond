name: backfill first-inning totals study

# This is the bounded historical study after the one-event coverage audit.
# It makes at most max_events event-odds calls (10 credits each) and samples
# deterministic dates across every available season rather than a cherry-picked
# contiguous month. The initial 500-event configuration is about 5,040
# credits including 40 historical event-discovery calls.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First eligible date (period-market history begins 2023-05-03)"
        required: true
        default: "2023-05-03"
      end:
        description: "Last completed MLB calendar date"
        required: true
        default: "2026-08-10"
      max_events:
        description: "Hard ceiling on event-odds calls (~10 credits each)"
        required: true
        default: "500"
      days_per_season:
        description: "Evenly spaced calendar dates sampled per season"
        required: true
        default: "10"
      lead_minutes:
        description: "Historical snapshot this many minutes before first pitch"
        required: true
        default: "10"
      dry_run:
        description: "Show the maximum spend without requesting data"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: first-inning-study
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Capture stratified first-inning totals
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python first_inning_odds.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --max-events "${{ inputs.max_events }}" \
            --days-per-season "${{ inputs.days_per_season }}" \
            --lead-minutes "${{ inputs.lead_minutes }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Label completed first innings and measure the market baseline
        if: ${{ !inputs.dry_run }}
        run: |
          python first_inning_results.py
          python first_inning_report.py

      - name: Commit study data
        if: ${{ !inputs.dry_run }}
        run: |
          bash commit_data.sh \
            "data: first-inning totals study ${{ inputs.start }}..${{ inputs.end }}" \
            data/first_inning_audit.csv \
            data/first_inning_quotes.csv \
            data/first_inning_results.csv \
            first_inning_evidence.json
