name: backfill first-inning totals study

# This is the bounded historical study after the one-event coverage audit.
# It makes at most max_events event-odds calls (10 credits each) and samples
# deterministic dates across every available season rather than a cherry-picked
# contiguous month. It checkpoints every chunk before moving to the next one,
# so a missing historical event cannot discard already-paid raw data.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First eligible date (period-market history begins 2023-05-03)"
        required: true
        default: "2023-05-03"
      end:
        description: "Last completed MLB calendar date"
        required: true
        default: "2026-08-10"
      max_events:
        description: "Total hard ceiling on event-odds calls (~10 credits each)"
        required: true
        default: "500"
      events_per_checkpoint:
        description: "Maximum paid event calls before committing a checkpoint"
        required: true
        default: "100"
      days_per_season:
        description: "Evenly spaced calendar dates sampled per season"
        required: true
        default: "10"
      lead_minutes:
        description: "Historical snapshot this many minutes before first pitch"
        required: true
        default: "10"
      dry_run:
        description: "Show the maximum spend without requesting data"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: first-inning-study
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Multi-thousand-event studies checkpoint every chunk; allow enough time
    # for a complete run while preserving each paid chunk if a request fails.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Capture and checkpoint stratified first-inning totals
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          total="${{ inputs.max_events }}"
          checkpoint="${{ inputs.events_per_checkpoint }}"
          if [ "$total" -lt 1 ] || [ "$checkpoint" -lt 1 ]; then
            echo "max_events and events_per_checkpoint must be positive" >&2
            exit 2
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python first_inning_odds.py \
              --start "${{ inputs.start }}" \
              --end "${{ inputs.end }}" \
              --max-events "$total" \
              --days-per-season "${{ inputs.days_per_season }}" \
              --lead-minutes "${{ inputs.lead_minutes }}" \
              --dry-run
            exit 0
          fi
          remaining="$total"
          batch=1
          while [ "$remaining" -gt 0 ]; do
            this_batch="$checkpoint"
            if [ "$this_batch" -gt "$remaining" ]; then this_batch="$remaining"; fi
            python first_inning_odds.py \
              --start "${{ inputs.start }}" \
              --end "${{ inputs.end }}" \
              --max-events "$this_batch" \
              --days-per-season "${{ inputs.days_per_season }}" \
              --lead-minutes "${{ inputs.lead_minutes }}"
            python first_inning_results.py
            python first_inning_report.py
            bash commit_data.sh \
              "data: first-inning totals checkpoint ${batch}" \
              data first_inning_evidence.json
            remaining=$((remaining - this_batch))
            batch=$((batch + 1))
          done

      - name: Seal any collected rows after an unexpected failure
        if: ${{ always() && !inputs.dry_run }}
        run: |
          python first_inning_results.py || true
          python first_inning_report.py
          bash commit_data.sh "data: preserve first-inning study checkpoint" \
            data first_inning_evidence.json
