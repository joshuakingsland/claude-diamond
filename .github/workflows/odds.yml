name: capture odds

# Rolling capture of the upcoming card: one consensus row per game-market and
# every paired book quote behind it.
#
# Cost. The standard odds endpoint bills one credit per region per market, so
# a run costs len(ODDS_REGIONS) x len(MARKETS) = 2 x 3 = 6 credits and does not
# scale with the number of games on the card. The schedule below is 13 hourly
# runs plus 4 half-hour runs in the pre-first-pitch window, so:
#
#     17 runs/day x 6 credits = 102 credits/day, about 3,100 a month
#
# Tune by deleting cron lines, not by trimming MARKETS: the three markets are
# read off one joint distribution and capturing them apart would leave the
# comparison unable to say anything about two of them.
#
# Timing. Baseball's decisive information arrives late, so the runs cluster
# near first pitch. The value of a capture is that some snapshot lands close
# to the close for every game; the afternoon slate is the known weak spot and
# the hourly runs from 15:00 UTC exist for it.
#
# GitHub only runs scheduled workflows on the default branch, and a schedule
# is disabled automatically after 60 days without repository activity. A
# silent gap in the data is a data problem, not just an ops one, so check the
# manifest rather than assuming the cron is alive.

on:
  schedule:
    # Hourly across the card (15:00-03:00 UTC covers afternoon through late
    # West Coast first pitches).
    - cron: "5 15-23,0-3 * * *"
    # Extra ticks where most first pitches actually land, for a tighter close.
    - cron: "35 22-23,0-1 * * *"
  workflow_dispatch:

permissions:
  contents: write

# No concurrency group. One was here to stop two captures racing on the quote
# log, on the assumption that a second run would queue behind the first. It
# does not: GitHub holds only one pending run per group, so a third arrival
# cancels the second outright. Scheduled runs fire at irregular times and
# sometimes bunch, and two captures were cancelled that way — a lost snapshot
# is only re-buyable from the historical endpoint at five times the price.
#
# Overlap is allowed instead, and the commit step merges: append-only logs are
# unioned so neither run's rows are lost, regenerated snapshots take the later
# version. See merge_data.py.

jobs:
  capture:
    runs-on: ubuntu-latest
    # The job had no bound at all, so the default six hours applied. It now
    # does three ingests as well as the capture, and a wedged HTTP call would
    # sit there burning Actions minutes while the next hour's run started
    # anyway. Twenty minutes is several times the observed runtime.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Skip out of season
        id: season
        # The regular season runs late March to early October, postseason to
        # early November. Polling a dead card burns credits for empty files.
        run: |
          month=$(date -u +%m)
          if [ "$month" = "12" ] || [ "$month" = "01" ] || [ "$month" = "02" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Month $month is out of season; skipping."
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.season.outputs.active == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.season.outputs.active == 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Capture odds
        if: steps.season.outputs.active == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        # --require-key turns a missing secret into a loud failure. Without it
        # the script exits zero having fetched nothing, and the workflow would
        # report green for weeks while capturing no data at all.
        #
        # --min-credits fails the run when the balance the API reports falls
        # below the floor. The quota is shared with any other project on this
        # key, so the balance can drop for reasons nothing here can see, and
        # the symptom of running dry is a capture that quietly stops returning
        # data. A missing snapshot cannot be bought back at the live price.
        run: python odds.py --require-key --min-credits 500

      - name: Price the card
        if: steps.season.outputs.active == 'true'
        env:
          # Optional, unlike ODDS_API_KEY. With none of these set, alerts.py
          # still detects and still writes the log; it just does not mail. A
          # fork with no mail secrets stays green.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          # ntfy needs no account and no second factor: the
          # topic name is the address. Set NTFY_TOPIC alone
          # and alerts arrive as phone push, which suits a
          # price with a ninety-second half-life better than
          # any inbox does.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          # Resend authenticates with a plain API key, so it
          # needs no second factor on any account. Until a
          # domain is verified its sandbox sender delivers
          # only to the address that owns the Resend account,
          # which is why RESEND_FROM is optional.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          BET_EMAIL_TO: ${{ secrets.BET_EMAIL_TO }}
        # Runs on every capture rather than on its own schedule. The lock
        # window, the edge rule and the day cap are all enforced inside
        # ledger.py, and a wager is written once and never revised, so running
        # this hourly is idempotent: quotes outside the window are rejected
        # and games already locked are skipped.
        #
        # Results are refreshed first, and only for the current season, which
        # is free and keyless. Before this the schedule and last night's
        # scores arrived once a week, so a card could be priced on team form
        # up to seven days stale -- and a game that had not been ingested had
        # no feature row and simply fell off the board.
        #
        # Boxscores, umpires and statcast ran in no workflow at all and were
        # only ever filled by hand. That degrades quietly rather than loudly: a starter
        # whose recent outings were never ingested keeps his old rating and
        # then falls back to a league prior, so the model goes on pricing with
        # no error anywhere. All three ingesters are resumable and skip what
        # they already hold, so the steady state is roughly fifteen games a
        # day. Statcast takes a --limit of three DATES rather than games: a
        # date is one Savant request covering the whole slate, and three a run
        # across seventeen runs a day keeps it ahead of the schedule while
        # bounding a cold start. The limit bounds a cold start instead of the job timeout doing
        # it, and weather is allowed to fail because it is the one that
        # depends on a third party being up.
        run: |
          # The four refreshes are best-effort: steps run under `bash -e`, and
          # a StatsAPI hiccup must not stop tonight's card being priced from
          # the table already on disk. They are all resumable, so a skipped
          # run costs nothing but freshness, and merge_table means a failed
          # fetch can no longer damage what is there.
          python results.py --seasons "$(date -u +%Y)" || echo "results refresh failed; using the table on disk"
          python boxscores.py --limit 120 || echo "boxscores incomplete; resumes next run"
          python umpires.py --limit 120 || echo "umpires incomplete; resumes next run"
          python statcast.py --seasons "$(date -u +%Y)" --limit 3 --pause 0.4 || echo "statcast incomplete; resumes next run"
          python weather.py --refresh-source || echo "weather incomplete; resumes next run"
          python schedule_snapshots.py || echo "starter snapshot failed; using the last capture"
          python lineup_snapshots.py || echo "lineup snapshot failed; card remains ineligible"
          # Not best-effort. A board that prices nothing is the failure this
          # step exists to surface, and letting it through would write an
          # empty page over a good one.
          python predict_upcoming.py
          python signal_ledger.py
          python ledger.py
          python forward_evidence.py
          # Runs directly after the capture so the quote it reads is seconds
          # old, not an hour. That distinction is the whole point: only 3% of
          # these prices survive an hour, but the alert is raised against the
          # snapshot that was just taken, so what reaches the inbox is roughly
          # two minutes stale rather than sixty. Best-effort, because a mail
          # server being down must not stop the page being written -- the
          # alert is already in data/shop_alerts.csv by then either way.
          python alerts.py --send || echo "alerting failed; detections are in the log"
          # Scores the alerts that already fired against their closes. Cheap,
          # keyless, and the only number here that was not chosen after the
          # fact -- the alerts cannot be re-selected, so a disappointing
          # result can only be reported, never tuned away.
          python alert_evidence.py || echo "alert scoring failed; log is intact"
          python model_card.py

      - name: Commit new quotes
        # always(), because a snapshot already written to disk must be
        # committed even when a later step failed. The credit floor is the
        # case that matters: odds.py writes the lines and quotes and only then
        # exits non-zero, so a success-gated commit would spend the credits,
        # capture the data, and discard it at exactly the moment credits are
        # scarce. A missed snapshot is only re-buyable at the historical
        # price, which is five times the live one. The job still reports
        # failure; this only stops the data going with it.
        if: ${{ always() && steps.season.outputs.active == 'true' }}
        run: |
          bash commit_data.sh "data: odds snapshot $(date -u +%Y-%m-%dT%H:%MZ)" \
            data docs forward_evidence.json alert_evidence.json
