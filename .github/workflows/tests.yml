name: tests

# The pipeline workflows commit data back to the repository, so a broken
# parser or a bad join would otherwise be discovered only after it had
# already written a few thousand rows of wrong CSV.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. python -m unittest discover -s tests -t . -v

      - name: Check the odds capture path runs without a key
        # Without ODDS_API_KEY this must exit clean and write a template
        # rather than crash. The scheduled workflow depends on that
        # distinction to tell a missing secret from a broken parser.
        run: python odds.py --lines "${RUNNER_TEMP}/lines.csv"
